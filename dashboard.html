<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICEC Advisor Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
margin:0;
color:#003366;
}

.card p{
font-size:28px;
font-weight:bold;
}

.menu{
margin-top:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.menu a{
background:#003366;
color:white;
text-decoration:none;
padding:20px;
text-align:center;
border-radius:10px;
font-weight:bold;
}

.menu a:hover{
background:#0055aa;
}

</style>

</head>

<body>

<div class="header">
<h1>ICEC Advisor Dashboard</h1>
<p>Welcome Advisor</p>
</div>

<div class="container">

<div class="cards">

<div class="card">
<h2>Total Leads</h2>
<p>0</p>
</div>

<div class="card">
<h2>Verified Leads</h2>
<p>0</p>
</div>

<div class="card">
<h2>Admissions</h2>
<p>0</p>
</div>

<div class="card">
<h2>Commission Earned</h2>
<p>₹0</p>
</div>

</div>

<div class="menu">

<a href="candidate-register.html">
Register Candidate
</a>

<a href="#">
Program Search
</a>

<a href="#">
My Candidates
</a>

<a href="#">
Commission Tracker
</a>

<a href="#">
Sub Advisors
</a>

<a href="index.html">
Home
</a>

</div>

</div>

</body>
</html>
