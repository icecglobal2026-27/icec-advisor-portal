<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Candidate</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#003366;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#003366;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0055aa;
}

.success{
display:none;
margin-top:20px;
background:#dff0d8;
padding:15px;
border-radius:5px;
color:#3c763d;
}

</style>

</head>

<body>

<div class="container">

<h1>Candidate Registration Form</h1>

<form id="candidateForm">

<div class="form-group">
<label>Candidate Name *</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Mobile Number *</label>
<input type="tel" required>
</div>

<div class="form-group">
<label>Email Address *</label>
<input type="email">
</div>

<div class="form-group">
<label>City *</label>
<input type="text">
</div>

<div class="form-group">
<label>Highest Qualification *</label>
<select>
<option>12th</option>
<option>Diploma</option>
<option>Graduate</option>
<option>Post Graduate</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Preferred Country</label>
<select>
<option>Australia</option>
<option>Canada</option>
<option>UK</option>
<option>New Zealand</option>
<option>USA</option>
<option>Europe</option>
</select>
</div>

<div class="form-group">
<label>Approximate Budget</label>
<input type="text">
</div>

<div class="form-group">
<label>Remarks</label>
<textarea rows="4"></textarea>
</div>

<button type="submit">
REGISTER CANDIDATE
</button>

</form>

<div class="success" id="msg">
Candidate registered successfully.
</div>

</div>

<script>

document.getElementById("candidateForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("msg").style.display="block";
this.reset();
});

</script>

</body>
</html>
