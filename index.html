<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ICEC Career Abroad Pathway Advisor Network</ title> <style> body{ margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; background:#f4f6f9; color:#333; lineheight:1.6; } .container{ max-width:1100px; margin:auto; padding:20px; } .hero{ background:#003366; color:#fff; text-align:center; padding:50px 25px; border-radius:10px; } .hero h1{ margin:0; font-size:38px; } .hero p{ font-size:18px; margin:20px 0; } .buttons{ margin-top:25px; } .btn{ display:inline-block; background:#fff; color:#003366; text-decoration:none; padding:14px 28px; margin:8px; border-radius:6px; font-weight:bold; } .btn:hover{ background:#e9eef5; } .scroll{ text-align:center; font-size:22px; font-weight:bold; color:#003366; margin:20px 0; } .card{ background:#fff; border-radius:10px; padding:25px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08); } .card h2{ color:#003366; margin-top:0; } .highlight{ background:#eef7ff; } .webinar{ background:#fff8db; } ul{ padding-left:22px; } .footer{ text-align:center; padding:20px; color:#666; } </style> </head> <body> <div class="container"> <div class="hero"> <h1>ICEC Career Abroad Pathway Advisor Network</h1> 1<p> Help students build successful international careers while earning attractive incentives from overseas education and career pathway opportunities. </p> <div class="buttons"> <a href="advisor-register.html" class="btn"> REGISTER NOW </a> <a href="advisor-login.html" class="btn"> ADVISOR LOGIN </a> </div> </div> <div class="scroll"> ↓ Scroll Down To Learn More ↓ </div> <div class="card"> <h2>Who Can Become an ICEC Advisor?</h2> <p> Students, Teachers, Professors, Career Counsellors, HR Professionals, Retired Persons, Entrepreneurs and Social Influencers can join the ICEC Advisor Network. </p> <p> Work from anywhere and help students discover study abroad opportunities, migration-linked courses and global career pathways. </p> </div> <div class="card highlight"> <h2>Advisor Earnings</h2> <ul> <li><strong>₹500</strong> for every candidate who completes counselling and submits documents for a detailed Study Abroad & Career Pathway Assessment.</li> <li><strong>₹10,000 – ₹20,000</strong> per successful admission after fee payment and expiry of the university refund period.</li> <li>Additional incentives on education loans, flight tickets, accommodation, insurance and related services.</li> <li>Access to ICEC training, resources and career pathway tools.</li> </ul> <h3>Principal Advisor Rewards</h3> <ul> <li>₹250 per eligible case generated by a sub-advisor.</li> <li>₹3,000 per successful admission generated by a sub-advisor.</li> <li>Build and mentor your own advisor network.</li> </ul> </div> 2<div class="card webinar"> <h2>Mandatory Orientation Webinar</h2> <p> All applicants must attend a free online orientation and training webinar before activation of their Advisor ID. </p> <ul> <li>Study Abroad Opportunities</li> <li>Skill Shortage Career Pathways</li> <li>Admission Process</li> <li>Advisor Incentive Structure</li> <li>Candidate Registration Process</li> <li>ICEC Portal Training</li> </ul> <p> <strong>Schedule:</strong> Conducted Weekly.<br> Date and time will be communicated after registration. </p> </div> <div class="card"> <h2>How It Works</h2> <ol> <li>Register as an ICEC Advisor.</li> <li>Attend the mandatory webinar.</li> <li>Receive your Advisor ID.</li> <li>Introduce prospective students to ICEC.</li> <li>Register candidates through the ICEC Portal.</li> <li>Track progress and commissions from your dashboard.</li> </ol> </div> <div class="card"> <h2>Important Conditions</h2> <ul> <li>All candidates must be registered through the ICEC Portal.</li> <li>Candidate ownership is established after OTP verification.</li> <li>Only verified candidates qualify for incentives.</li> <li>False or duplicate registrations may lead to removal from the advisor panel.</li> <li>ICEC reserves the right to verify all registrations and admissions.</li> </ul> </div> <div class="footer"> © ICEC – International Career & Educational Consultants </div> </div> </body> </html>
